
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fetch API Demo</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 30px;
        }

        button {
            padding: 10px 15px;
            margin-right: 5px;
            margin-bottom: 10px;
            cursor: pointer;
        }

        #output {
            margin-top: 20px;
            border: 1px solid #ccc;
            padding: 15px;
            border-radius: 5px;
        }

        .error {
            color: red;
        }

        .success {
            color: green;
        }
    </style>
</head>
<body>

    <h2>Exploring the Fetch API</h2>

    <button id="loadData">Load Post Data</button>
    <button id="createPost">Create New Post</button>

    <div id="output">
        Click a button to begin.
    </div>

    <script>
        const output = document.getElementById("output");

        document.getElementById("loadData").addEventListener("click", function() {
            output.className = "";
            output.textContent = "Loading post data...";

            fetch("https://jsonplaceholder.typicode.com/posts/1")
                .then(response => {
                    if (!response.ok) {
                        throw new Error("HTTP error! Status: " + response.status);
                    }

                    return response.json();
                })
                .then(data => {
                    output.className = "";

                    const title = document.createElement("h3");
                    title.textContent = "Post Title: " + data.title;

                    const content = document.createElement("p");
                    content.textContent = "Content: " + data.body;

                    output.replaceChildren(title, content);
                })
                .catch(error => {
                    output.className = "error";
                    output.textContent = "Error: " + error.message;
                });
        });

        document.getElementById("createPost").addEventListener("click", function() {
            output.className = "";
            output.textContent = "Creating new post...";

            fetch("https://jsonplaceholder.typicode.com/posts", {
                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify({
                    title: "My New Post",
                    body: "Learning Fetch API is fun!",
                    userId: 1
                })
            })
                .then(response => {
                    if (!response.ok) {
                        throw new Error("HTTP error! Status: " + response.status);
                    }

                    return response.json();
                })
                .then(data => {
                    output.className = "success";
                    output.textContent =
                        "New Post Created! Post ID: " + data.id;
                })
                .catch(error => {
                    output.className = "error";
                    output.textContent = "Error: " + error.message;
                });
        });
    </script>

</body>
</html>
